spring:
  main:
    banner-mode: off
    log-startup-info: false
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 2000
    openfeign:
      client:
        config:
          default: # применяется по умолчанию для всех клиентов
            connectTimeout: 2000
            readTimeout: 3000
          inventory-service:
            loggerLevel: basic

logging:
  level:
    ru.yandex.practicum.telemetry: WARN
    ru.yandex.practicum.order.feign.InventoryClient: DEBUG
    org:
      springframework: ERROR
      apache.kafka: WARN

kafka:
  bootstrap-servers: "localhost:9092"
  auto-offset-reset: earliest

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
