server:
  # Выбирает свободный порт при запуске сервиса.
  port: 0

spring:
  jpa:
    hibernate:
      # Проверяет соответствие схемы БД сущностям, не изменяя схему.
      ddl-auto: validate
  datasource:
    # JDBC-адрес базы данных сервиса склада.
    url: jdbc:postgresql://localhost:5432/inventory_db
    # Имя пользователя базы данных.
    username: dbuser
    # Пароль пользователя базы данных.
    password: "12345"
  sql:
    init:
      # Выполняет SQL-инициализацию при каждом запуске.
      mode: always
